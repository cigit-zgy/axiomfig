family: heatmap
variants:
  basic:
    input_mode: direct
    required: [matrix, row_labels, column_labels, color_semantics]
    optional: [center, annotations, colorbar_label]
  correlation:
    input_mode: precomputed
    required: [matrix, labels, center]
    optional: [annotations, colorbar_label]
  clustered:
    input_mode: precomputed
    required: [matrix, row_labels, column_labels, row_order, column_order, color_semantics]
    optional: [center, annotations, colorbar_label]
  confusion_matrix:
    input_mode: precomputed
    required: [matrix, class_labels]
    optional: [annotations, colorbar_label]
  annotated:
    input_mode: direct
    required: [matrix, row_labels, column_labels, color_semantics, annotations]
    optional: [center, colorbar_label, annotation_format]
