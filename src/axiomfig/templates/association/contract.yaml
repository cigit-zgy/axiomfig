family: association
variants:
  mantel:
    input_mode: precomputed
    required: [correlation_matrix, labels, links]
    optional:
      - p_values
      - lower_ci
      - upper_ci
      - matrix_method
      - matrix_type
      - matrix_region
      - diagonal
      - order
      - hclust_method
      - clusters
      - lower_method
      - upper_method
      - coefficients
      - coefficient_format
      - significance_mode
      - significance_thresholds
      - ci_mode
      - coupling
      - nonsignificant_links
      - link_width_mode
      - p_value_mode
      - show_nonsignificant
    link_fields: [source, target, mantel_r, p_value]
    advanced_reference: references/mantel.md
  correlation_network:
    input_mode: precomputed
    required: [nodes, edges, edge_weight]
    optional: [groups, significance, strength_label]
