family: scatter
variants:
  simple:
    required: [x, y]
    optional: [xlabel, ylabel]
  grouped:
    required: [x, y, group]
    optional: [xlabel, ylabel]
  regression:
    required: [x, y, fitted]
    optional: [fit_label, xlabel, ylabel]
  parity:
    required: [observed, predicted]
    optional: [identity_limits, xlabel, ylabel]
  bubble:
    required: [x, y, size]
    optional: [size_label, group, xlabel, ylabel]
  hexbin:
    required: [x, y]
    optional: [gridsize, count_label, xlabel, ylabel]
