version: 1

geometry:
  single-column: { width_mm: 90.0, aspect: 1.3333333333333333 }
  onehalf-column: { width_mm: 140.0, aspect: 1.3333333333333333 }
  double-column: { width_mm: 190.0, aspect: 1.3333333333333333 }

typography:
  default: sans
  sizes_pt: { base: 8.0, small: 7.0, label: 8.0, title: 9.0, panel: 11.0 }

stroke: { main_stroke_pt: 0.8, fill_edge_pt: 0.6 }

ticks:
  geometry:
    minor_to_major_inward_ratio: 0.6180339887
    minor_length_pt: 1.854
    major_length_pt: 5.9996700308
  open:
    major: { direction: inout, length_token: major }
    minor: { direction: in, length_token: minor }
  filled:
    major: { direction: out, length_token: major }
    minor: { direction: out, length_token: minor }
  categorical: { length_pt: 0.0 }

axes:
  nice_linear:
    target_major_ticks: [5, 7]
    step_mantissas: [1.0, 2.0, 2.5, 5.0]
    minor_divisor: 2.0
    whole_step_blank_fraction: 0.25
  top_tick_labels: false
  right_tick_labels: false

legend:
  single_series: none
  location: outside-top-right
  top_gap_pt: 0.4666666667
  handlelength: 1.0
  columnspacing: 1.0
  handletextpad: 0.8
  labelspacing: 0.5
  borderpad: 0.0
  borderaxespad: 0.0
  frame: false
  prefer_single_row: true

panel:
  format: "({letter})"
  font_size_pt: 11.0
  font_weight: bold
  left_offset_pt: -1.0
  top_offset_pt: 1.0

output:
  margin_mode: tight
  allowed_margin_modes: [tight, normal, custom]
  padding_pt: 1.5

layout:
  single_panel:
    margins: { left: 0.20, right: 0.89, bottom: 0.20, top: 0.84 }
    colorbar_width_ratio: 0.055
    colorbar_wspace: 0.10
  multi_panel:
    horizontal_gap_pt: 12.0
    vertical_gap_pt: 16.0
    containment_padding_pt: 1.5
    colorbar_width_pt: 9.0
    colorbar_gap_pt: 4.0

series:
  line_styles: [solid, dashdot, dotted, long-dash]
  markers: [o, s, '^', D, v, P, X, h]
  long_dash_pattern: [6.0, 2.0]
  reference_line_style: dashdot

plots:
  line: { linewidth_token: main_stroke }
  line_marker:
    marker: o
    marker_size_pt: 5.2
    edge_color: black
    edge_width_token: fill_edge
  confidence_interval:
    alpha: 0.22
    edge_color: black
    edge_width_token: fill_edge
  scatter:
    marker_size_pt2: 36.0
    alpha: 0.55
    edge_color: black
    edge_width_token: fill_edge
  errorbar:
    marker: o
    marker_size_pt: 5.2
    edge_color: black
    edge_width_token: fill_edge
    cap_size_pt: 2.5
  bar:
    alpha: 0.82
    edge_color: black
    edge_width_token: fill_edge
    single_width: 0.60
    group_width: 0.76
    value_labels: true
    decimals: 2
  boxplot:
    alpha: 0.72
    edge_color: black
    edge_width_token: fill_edge
    width: 0.55
    combined_width: 0.22
  violin:
    alpha: 0.72
    combined_alpha: 0.42
    edge_color: black
    edge_width_token: fill_edge
    width: 0.82
    limit_padding_fraction: 0.02
  histogram: { alpha: 0.72, edge_color: black, edge_width_token: fill_edge }
  heatmap:
    sequential_cmap: cividis
    diverging_cmap: RdBu_r
    interpolation: nearest

rendering: { pdf_fonttype: 42, ps_fonttype: 42, dpi: 300, transparent: false }
