version: 1
default: sans

modes:
  sans: {text: latin-modern-sans, math: latin-modern-math, mono: maple-mono}
  serif: {text: latin-modern-roman, math: latin-modern-math, mono: maple-mono}

families:
  latin-modern-sans:
    family: Latin Modern Sans
    matplotlib_family: LMSans10
    filenames:
      regular: lmsans10-regular.otf
      bold: lmsans10-bold.otf
      italic: lmsans10-oblique.otf
      bold_italic: lmsans10-boldoblique.otf
    source: https://ctan.org/pkg/lm
    license: GUST Font License
    license_url: https://mirrors.ctan.org/fonts/lm/doc/fonts/lm/GUST-FONT-LICENSE.txt
    copyright: Copyright 2003-2021 B. Jackowski and J.M. Nowacki
    bundled: false
  latin-modern-roman:
    family: Latin Modern Roman
    matplotlib_family: LMRoman10
    filenames:
      regular: lmroman10-regular.otf
      bold: lmroman10-bold.otf
      italic: lmroman10-italic.otf
      bold_italic: lmroman10-bolditalic.otf
    source: https://ctan.org/pkg/lm
    license: GUST Font License
    license_url: https://mirrors.ctan.org/fonts/lm/doc/fonts/lm/GUST-FONT-LICENSE.txt
    copyright: Copyright 2003-2021 B. Jackowski and J.M. Nowacki
    bundled: false
  latin-modern-math:
    family: Latin Modern Math
    matplotlib_family: Latin Modern Math
    filenames: {regular: latinmodern-math.otf}
    source: https://ctan.org/pkg/lm-math
    license: GUST Font License
    license_url: https://mirrors.ctan.org/fonts/lm-math/GUST-FONT-LICENSE.txt
    copyright: Copyright 2012-2014 B. Jackowski, P. Strzelczyk, P. Pianowski
    bundled: false
  maple-mono:
    family: Maple Mono
    matplotlib_family: Maple Mono
    filenames: {regular: "MapleMono[wght].ttf"}
    source: https://github.com/subframe7536/maple-font
    license: SIL Open Font License 1.1
    license_url: https://github.com/subframe7536/maple-font/blob/variable/OFL.txt
    copyright: Copyright 2022 The Maple Mono Project Authors
    bundled: false

optional_system_fonts:
  arial: {family: Arial, bundled: false}
  times-new-roman: {family: Times New Roman, bundled: false}
  simsun: {family: SimSun, bundled: false}
  yu-gothic: {family: Yu Gothic, bundled: false}

search_roots:
  - ~/Library/Fonts
  - /Library/Fonts
  - /System/Library/Fonts
  - /opt/homebrew/share/fonts
