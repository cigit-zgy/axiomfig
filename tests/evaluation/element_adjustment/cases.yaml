version: 1
cases:
  - id: A01
    group: A
    request: Plot observed versus predicted concentration as a publication parity figure using AxiomFig defaults.
    available_data: {format: csv, columns: [observed, predicted]}
    expected: &default
      element: figure
      needs_nondefault: false
      topic: none
      recommended_surface: deterministic defaults
      surface_status: DEFAULT
      implementation_level: none
      default_retained_elsewhere: true
      scientific_anchor_preserved: true
  - id: A02
    group: A
    request: Show the trajectories of three supplied treatment series over time with the normal AxiomFig style.
    available_data: {format: json, keys: [time, series_values, series_labels]}
    expected: *default
  - id: A03
    group: A
    request: Render this supplied correlation matrix without any special visual treatment.
    available_data: {format: json, keys: [matrix, labels, center]}
    expected: *default
  - id: A04
    group: A
    request: Make a forest plot from these supplied estimates, confidence intervals, and null reference.
    available_data: {format: csv, columns: [label, estimate, interval, uncertainty_type, reference]}
    expected: *default
  - id: A05
    group: A
    request: Draw the supplied Mantel correlation matrix and links using the canonical appearance.
    available_data: {format: json, keys: [correlation_matrix, labels, links]}
    expected: *default
  - id: A06
    group: A
    request: Compare the complete distributions for four reactors with a violin plot and standard defaults.
    available_data: {format: csv, columns: [reactor, concentration]}
    expected: *default

