    researcher_request: Render supplied PCA scores for three groups, supplied dispersion ellipses and loadings, twelve loading labels, explained-variance axes, and origin references.
    available_data: {format: json, keys: [scores, groups, ellipse_paths, loadings, loading_labels, explained_variance]}
    source_fixture: fixtures.case_15
