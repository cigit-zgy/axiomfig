  - id: "11"
    name: upset
    authoritative_source: https://upsetplot.readthedocs.io/en/stable/auto_examples/index.html
    researcher_request: Plot the supplied set intersections as an UpSet figure with set totals, intersection bars, the membership matrix, connectors, labels, and count annotations.
    available_data: {format: json, keys: [set_names, membership, intersection_counts, set_totals]}
