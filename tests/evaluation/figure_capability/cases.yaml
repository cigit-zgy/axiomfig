    authoritative_source: references/mantel.md
    researcher_request: Render the supplied Pearson matrix and Mantel r and p links for four source groups using the current canonical Mantel grammar and long environmental labels.
    available_data: {format: json, keys: [correlation_matrix, labels, sources, mantel_links]}
