  - id: "12"
    name: oncoprint
    authoritative_source: https://jokergoo.github.io/ComplexHeatmap-reference/book/oncoprint.html
    researcher_request: Render the supplied alteration matrix with multiple glyph types per cell, top and right frequencies, row names, column groups, percentages, and compact legends.
    available_data: {format: json, keys: [alterations, genes, samples, sample_groups, top_frequency, right_frequency, percentages]}
