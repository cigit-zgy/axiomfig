    researcher_request: Compose supplied ROC, precision-recall, DET, and confusion-matrix results for two models in a 2 by 2 classifier dashboard with shared model identity and a matrix colorbar.
    available_data: {format: json, keys: [models, roc, precision_recall, det, confusion_matrix]}
    source_fixture: fixtures.case_17
    expected_anatomy: [roc_axes, precision_recall_axes, det_axes, confusion_matrix_axes, global_legend, colorbar]
    positioning_relations: [equal_size, alignment, shared_legend, containment]
