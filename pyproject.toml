[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomfig"
version = "1.1.0"
description = "Deterministic scientific figures and Figure Intent execution for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["scientific-visualization", "matplotlib", "llm-agent", "publication"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "fonttools>=4.59",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pillow>=11.3",
  "pypdf>=6.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/cigit-zgy/axiomfig-skill"
Repository = "https://github.com/cigit-zgy/axiomfig-skill"
Issues = "https://github.com/cigit-zgy/axiomfig-skill/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
  "scipy>=1.16",
  "setuptools>=80",
]

[project.scripts]
axiomfig-render = "axiomfig.cli:render_main"
axiomfig-intent = "axiomfig.cli:intent_main"
axiomfig-validate = "axiomfig.cli:validate_main"
axiomfig-gallery = "axiomfig.cli:gallery_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiomfig = [
  "resources/styles/*.yaml",
  "resources/latex/*.sty",
  "resources/latex/*.tex",
  "resources/fonts/*.otf",
  "resources/fonts/*.ttf",
  "resources/fonts/licenses/*",
  "templates/index.yaml",
  "templates/*/contract.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: requires Tectonic and Poppler",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
